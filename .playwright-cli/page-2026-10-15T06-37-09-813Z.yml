    - region "Stories" [ref=e75]:
      - article [ref=e76]:
        - heading "Explore Rome on foot, together" [level=2] [ref=e77]
        - figure "Runners from behind wearing black Roma t-shirts with winged-foot prints." [ref=e78]:
          - img "Runners from behind wearing black Roma t-shirts with winged-foot prints" [ref=e80]
        - paragraph [ref=e83]: Be a part of the Amor Run Club community and experience the joy of running together through the beautiful streets of Rome. Whether you’re looking to improve your fitness, make new friends, or simply enjoy the city from a different perspective, we welcome runners of all levels. Join us for our weekly runs and social gatherings, and make the most of your time in the Eternal City.
        - link "Join the club on Strava" [ref=e84] [cursor=pointer]:
          - /url: https://www.strava.com/clubs/1224988
      - article [ref=e87]:
        - heading "Get involved" [level=2] [ref=e88]
        - figure "Two runners in club t-shirts clasping hands and laughing on a cobbled street." [ref=e89]:
          - img "Two runners in club t-shirts clasping hands and laughing on a cobbled street" [ref=e91]
        - paragraph [ref=e93]: Amor Run Club in Rome is your gateway to fitness and fun! Join our vibrant community of runners, where every stride brings joy and new friendships. Whether you’re a seasoned runner or just starting out, our inclusive environment welcomes all levels. We organize scenic runs through Rome’s beautiful landscapes, followed by social events to bond over shared passions. With Amor Run Club, fitness becomes a delightful journey. Come run with us and discover the magic of running together!
        - link "Join our WhatsApp community" [ref=e94] [cursor=pointer]:
          - /url: https://chat.whatsapp.com/H0ZIIUmXV1ND4bi73CpGDf
